        if (!INT) {                                  // pull the camera in when a building sits between it and the player
          for (var cs3 = 3; cs3 < hz0; cs3 += 2) {
            if (inBuilding(player.x + Math.sin(yaw) * cs3, player.z + Math.cos(yaw) * cs3) && cs3 / hz0 * hs0 < 18) { occ = Math.max(0.3, (cs3 - 3) / hz0); break; }
          }
          if (occ < cityOcc) cityOcc = occ; else cityOcc += (occ - cityOcc) * Math.min(1, dt * 2.5);
        } else cityOcc = 1;
        var ot = (1 - cityOcc) / 0.7, pe = pitch + (1.42 - pitch) * ot, cd2 = cdist * (1 - 0.25 * ot);
        var hz = Math.cos(pe) * cd2; height = Math.sin(pe) * cd2; camEff = cd2; ty = 0.6;
        cx2 = player.x + Math.sin(yaw) * hz; cz2 = player.z + Math.cos(yaw) * hz;
      } else {
        var dist = drv ? sp2.camBack : camDist;
        if (drv && Math.abs(drv.speed) > 2 && now / 1000 - dragT > 1.5) yaw = lerpAngle(yaw, drv.v.rot + (drv.speed < 0 ? 0 : Math.PI), Math.min(1, dt * 1.6));
        var eff = dist;
        for (var cs = 2; cs <= dist; cs += 1) {
          if (inBuilding(player.x + Math.sin(yaw) * cs, player.z + Math.cos(yaw) * cs)) { eff = Math.max(1.8, cs - 1.5); break; }
        }
        camEff += (eff - camEff) * Math.min(1, dt * 10);
        if (eff < camEff) camEff = eff;
        height = Math.max(drv ? 2.6 : 2.2, camEff * (drv ? 0.42 : 0.6));
        cx2 = player.x + Math.sin(yaw) * camEff; cz2 = player.z + Math.cos(yaw) * camEff; ty = drv ? (drv.v.kind === 'okada' ? 1.2 : 1.6) : 1.3;
      }
      if (Math.abs(camPos.x - cx2) + Math.abs(camPos.z - cz2) > 70) { camPos.x = cx2; camPos.y = height; camPos.z = cz2; }
      var k = 1 - Math.exp(-dt * (city ? 5 : 6));
      camPos.x += (cx2 - camPos.x) * k; camPos.y += (height - camPos.y) * k; camPos.z += (cz2 - camPos.z) * k;
      camera.position.copy(camPos);
      if (shakeAmp > 0) { camera.position.x += (Math.random() - 0.5) * shakeAmp; camera.position.y += (Math.random() - 0.5) * shakeAmp * 0.6; }
      camTarget.set(player.x, ty, player.z);
      camera.lookAt(camTarget);
      var fovT = city ? (INT ? 42 : 38) : 60 + (drv ? 14 * Math.min(1, Math.abs(drv.speed) / sp2.max) : 0);
      if (Math.abs(camera.fov - fovT) > 0.1) { camera.fov += (fovT - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix(); }
      playerRing.visible = !drv && !introOpen; playerRing.position.set(player.x, 0.09, player.z); playerRing.scale.setScalar(city ? 1.5 : 1);
      if (!drv) player.group.scale.setScalar(city ? CITYK : 1);
      updatePins(city && !INT && !introOpen);

      // sun and shadow box follow the player; sky follows the camera
      var sx = Math.round(player.x), sz = Math.round(player.z);
      sun.target.position.set(sx, 0, sz);
      sun.position.set(sx + SUN_DIR.x * 260, SUN_DIR.y * 260, sz + SUN_DIR.z * 260);
      sky.position.copy(camera.position);
      SKYU.time.value = now / 1000;

      // chunk visibility, tree distance and which chunks cast shadows
      var TV = quality === 'high' ? 480 : 320;
      for (var ci = 0; ci < chunkList.length; ci++) {
        var c = chunkList[ci];
        var cd = Math.hypot((c.cx + 0.5) * CH - player.x, (c.cz + 0.5) * CH - player.z);
        var vis = cd < VIEW + CH * 0.75;
        if (c.vis !== vis) { c.vis = vis; for (var mi = 0; mi < c.meshes.length; mi++) c.meshes[mi].visible = vis; }
        if (vis) {
          var cast = cd < 200 + CH;
          for (var mj = 0; mj < c.meshes.length; mj++) if (c.meshes[mj].userData.casts) c.meshes[mj].castShadow = cast;
        }
        if (c.trees.length) {
          var tv = cd < TV + CH * 0.75, tc = cd < 150 + CH;
          for (var tj = 0; tj < c.trees.length; tj++) { c.trees[tj].visible = tv; c.trees[tj].castShadow = tc; }
        }
      }
      for (var li = 0; li < labels.length; li++) {
        var L = labels[li];
        var dd = Math.hypot(L.x - player.x, L.z - player.z);
        L.s.visible = !city && dd < L.maxD;
        if (L.s.visible) { var kk = Math.min(6, Math.max(1, dd / 70)); L.s.scale.set(14 * kk, 3.5 * kk, 1); }
      }

      // ---- prompt ----
      cand = (paused || working) ? null : (INT ? intCandidate() : (lecture ? null : findCandidate()));
      nearSpotObj = cand && cand.kind === 'spot' ? cand.s : null;
      if (cand) {
        var ptxt = cand.kind === 'spot' ? spotText(cand.s) : cand.txt;
        elPrompt.textContent = (isTouch ? 'Tap ACT' : 'Press E') + ' - ' + ptxt;
        elPrompt.style.display = 'block';
      } else elPrompt.style.display = 'none';

      // ---- zone banner ----
      var z = INT ? currentZone : zoneAt(player.x, player.z);
      if (z !== currentZone) { currentZone = z; elZone.textContent = z.name; if (!DL.on) show(z.line, 3500); }

      // ---- tracking beacon, next-up text, minimap ----
      trackT -= dt;
      if (trackT <= 0) { trackT = 0.4; track = DEST ? DEST : currentTrack(); if (DEST && !INT && Math.hypot(DEST.x - player.x, DEST.z - player.z) < 12) { show('You have arrived: ' + DEST.label, 2500); setDest(null); track = currentTrack(); } }
      if (INT) { beacon.visible = false; elNext.style.display = 'none'; }
      else if (track) {
        var td = Math.hypot(track.x - player.x, track.z - player.z);
        beacon.visible = td > 14;
        beacon.position.set(track.x, 30, track.z);
        beacon.material.color.copy(LC(track.kind === 'class' ? 0x60a5fa : 0xf472b6));
        var nt = 'Next: ' + track.label + ' (' + (td > 1000 ? (td / 1000).toFixed(1) + ' km' : Math.round(td) + ' m') + ')' + (track.start ? ' at ' + (dayOf(track.start) !== dayOf(G.t) ? DAYS3[dayOf(track.start)] + ' ' : '') + hhmm(track.start) : '');
        if (nt !== lastNext) { lastNext = nt; elNext.textContent = nt; }
        elNext.style.display = 'block';
      } else { beacon.visible = false; elNext.style.display = 'none'; }
      minimapT -= dt;
      if (minimapT <= 0) { minimapT = 0.12; if (!INT) drawMini(track); }

      // class reminder
      var ns = nextSession();
      if (ns && ns.start - G.t < 30 && ns.start - G.t > 0 && lastRemind !== ns.key && !paused) {
        lastRemind = ns.key;
        show(ns.c.code + ' starts at ' + hhmm(ns.start) + ' at ' + ns.c.venue + '. Move!', 4500); AUD.click();
      }

      // ---- HUD ----
      var clk = clockText() + '   Wk ' + weekOf(G.t) + (W.rain > 0.3 ? '   Rain' : (W.ov > 0.5 ? '   Cloudy' : '   Clear')) + (blackout() ? '   NEPA off' : '') + (G.umbrella ? '   Umbrella' : '') + '   ' + LEVELS[levelOf(G.aura)][1] + ' ' + G.aura;
      if (clk !== lastClock) { lastClock = clk; elClock.textContent = clk; }
      var en = Math.round(G.energy);
      var hud = naira(G.cash) + '   Energy ' + en + '   Hunger ' + Math.round(G.hunger) + '   CGPA ' + G.cgpa.toFixed(2);
      if (hud !== lastHud) {
        lastHud = hud; elHud.textContent = hud;
        elBar.style.width = en + '%'; if (elHungerFill) { elHungerFill.style.width = Math.round(G.hunger) + '%'; elHungerFill.style.background = G.hunger > 40 ? '#fb923c' : (G.hunger > 15 ? '#facc15' : '#ef4444'); }
        elBar.style.background = en > 50 ? '#4ade80' : (en > 20 ? '#facc15' : '#ef4444');
      }

      // ---- sound ----
      var nc = 0, ni;
      for (ni = 0; ni < npcs.length; ni++) if (Math.abs(npcs[ni].x - player.x) < 40 && Math.abs(npcs[ni].z - player.z) < 40) nc++;
      for (ni = 0; ni < TALK.length; ni++) if (Math.abs(TALK[ni].x - player.x) < 30 && Math.abs(TALK[ni].z - player.z) < 30) nc += 2;
      var mvr = { vol: 0, pan: 0, speed: 0 }, trf = 0, bestMv = 1e9;
      for (ni = 0; ni < MOVERS.length; ni++) {
        var mvv = MOVERS[ni].v, dxm = mvv.x - player.x, dzm = mvv.z - player.z, dm = Math.sqrt(dxm * dxm + dzm * dzm);
        if (dm < 120) trf += 1 - dm / 120;
        if (dm < bestMv) {
          bestMv = dm; mvr.vol = Math.max(0, 1 - dm / 80); mvr.speed = 8;
          mvr.pan = (dxm * Math.cos(yaw) - dzm * Math.sin(yaw)) / (Math.abs(dm) + 6);
        }
      }
      var gen = 0;
      if (blackout()) { var gd = Math.hypot(player.x - D.spots.print[0], player.z - D.spots.print[1]); gen = Math.max(0, 1 - gd / 120); }
      else { var gd2 = Math.hypot(player.x - D.spots.print[0], player.z - D.spots.print[1]); gen = Math.max(0, 0.3 - gd2 / 200); }
      soundS.wind = Math.min(1, 0.25 + W.rain * 0.6 + (W.state === 'storm' ? 0.3 : 0));
      soundS.rain = W.rain; soundS.crowd = Math.min(1, nc / 7); soundS.gen = gen; soundS.traf = Math.min(1, trf); soundS.day = W.day;
      soundS.drive = !!drv; soundS.speed = drv ? drv.speed : 0; soundS.max = drv ? VSPEC[drv.v.kind].max : 20; soundS.kind = drv ? drv.v.kind : 'okada';
      soundS.mover = mvr;
      AUD.update(soundS, dt);
    }

    function frame(t) {
      var now = t || performance.now();
      var dt = Math.min(0.05, (now - (lastT || now)) / 1000);
      lastT = now;
      update(dt, now);
      renderer.render(scene, camera);
      if (firstFrame) { firstFrame = false; elLoading.style.display = 'none'; }
      requestAnimationFrame(frame);
    }

    buildPins();
    if (!G.introDone) { introOpen = true; }
    NET.init().then(function () {
      if (NET.serverProfile && !G.introDone && NET.applyServerProfile()) {
        introOpen = false; rebuildPlayer(G.female); if (G.home) { var h0 = homeById(G.home.id), o0 = findOpen(h0.x + 5, h0.z + 5, 2, 40, 1); player.x = o0[0]; player.z = o0[1]; }
        show('Welcome back, ' + G.name + '.', 4000);
      } else if (!G.introDone) showIntro();
      else { if (G.female) rebuildPlayer(true); show('Welcome back, ' + (G.name || 'student') + '. ' + clockText() + '. Press J for your phone.', 4500); NET.refreshPolicy(); }
    }, function () { if (!G.introDone) showIntro(); });
    pickWeather(); W.ov = W.ovT; W.rain = W.rainT;
    var streakMsg = dailyStreak(); if (streakMsg) setTimeout(function () { banner('Daily allowance', streakMsg); AUD.coin(); }, 3500);
    window.IFE_DEBUG = { trade: function () { return { PT: PT, ptApply: ptApply, ptEnterVisit: ptEnterVisit, peopleHTML: peopleHTML, tradeTick: tradeTick, ptClaim: ptClaim, ptSetCash: ptSetCash, ptRedraw: ptRedraw, ptStash: ptStash, setNet: function (m) { NET.mode = m; } }; }, voice: function () { return { VEH: VEH, VT: VT, VPLACE: VPLACE, EV: EV, SOUND_FILES: SOUND_FILES, matchOn: matchOn(), serviceOn: serviceOn(), callOn: callOn(), voiceTick: voiceTick, evSpawn: evSpawn, evTick: evTick, marketDialog: marketDialog, chapelDialog: chapelDialog, mosqueDialog: mosqueDialog, sportsDialog: sportsDialog, VOX: VOX }; }, AGENTS: AGENTS, crowdStats: function () { return { active: activeCount, drawn: drawnCount, total: CROWD_N }; }, COINS: COINS, startMG: startMG, mgState: function () { return mg; }, mgPress: mgPress, mgChoose: mgChoose, runMG: runMG, NET: NET, CLASSES: CLASSES, FURN: FURN, HOMES: HOMES, homeDialog: homeDialog, jobGate: jobGate, startExam: startExam, finishIntro: function (n, f, c, o, lv) { return finishIntro(n, f, c, o, lv); }, HALLS: HALLS, allocateHome: allocateHome, roomResidents: roomResidents, goCorridor: goCorridor, hallGate: hallGate, hallOf: hallOf, homeById: homeById, enterOwnRoom: enterOwnRoom, knockRoom: knockRoom, blockOf: blockOf, SLV: SLV, COURSES: COURSES, orientLeft: orientLeft, taskDialog: taskDialog, hallEligible: hallEligible, pending: function () { return PENDING; }, polMul: polMul, isExamWeek: isExamWeek, evActive: evActive, evNext: evNext, attendEvent: attendEvent, worthNow: worthNow, POLICIES: POLICIES, sessionsFor: sessionsFor, drawQs: drawQs, rollClassLocal: rollClassLocal, comfortScore: comfortScore, powered: powered, needsTick: needsTick, doSleep: doSleep, sellFurn: sellFurn, rentOf: rentOf, mySpot: mySpot, barred: barred, QB: QB, phone: function () { return { tab: phoneTab, open: panelOpen }; }, closePhone: closePhone, jobSpots: function () { return SPOTS.filter(function (s) { return s.type === 'job'; }); }, flushNet: function () { return NET.flush(); }, introOpen: function () { return introOpen; }, buyFurn: buyFurn, placeFurn: placeFurn, allowance: allowance, housekeeping: housekeeping, openPhone: openPhone, flexCanvas: function () { return flexCanvas(); }, ACH: ACH, player: player, spots: SPOTS, col: COL, tryInteract: interact, chunks: chunkList,
      LM: LM, state: function () { return { cash: G.cash, energy: G.energy }; }, G: G, W: W, DL: DL, TALK: TALK, QD: QD, npcs: npcs, labels: labels,
      setYaw: function (v) { yaw = v; }, setCam: function (v) { camDist = v; }, setCity: function (v) { cityDist = v; }, veh: VEH, scene: scene, renderer: renderer, camera: camera, inBuilding: inBuilding,
      close: closeDlg, enter: enterVehicle, exit: exitVehicle, drv: function () { return drv; }, pick: pickChoice, openDlg: openDlg, advance: advanceDlg, setWeather: setWeather, nextSession: nextSession, startLecture: startLecture,
      INT: function () { return INT; }, enterInterior: enterInterior, exitInterior: exitInterior, intCandidate: intCandidate, useSpot: useSpot, SPOTS: SPOTS, resolveInt: resolveInt, standUp: standUp, doHorn: doHorn, BOOK: BOOKSHELVES, pq: pqCount, rainNow: function () { return rainNow; },
      lecture: function () { return lecture; }, NET: NET, SOC: SOC, REMOTES: function () { return REMOTES; }, campus: function () { return { lamps: LAMPPOS, night: function () { return [NIGHTU.value, lampHeadMat.color.r, poolMat.opacity, blackout()]; }, ms: CAMPUS.ms, PROP: PROP, parties: PARTIES, partyOpen: partyOpen, PSPOT: PSPOT, partyTick: partyTick }; }, runCmd: runCmd, ctxTags: ctxTags, findPlace: findPlace, getDest: function () { return DEST; }, panel: togglePanel, ride: function () { return RIDE; }, newRide: newRide, advanceTime: advanceTime, findCandidate: findCandidate, update: update, sessionNow: sessionNow, keys: keys, track: function () { return track; } };
    requestAnimationFrame(frame);
  }
})();
